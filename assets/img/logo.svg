  <text x="0" y="24" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="3.5" fill="#16325C"><tspan font-weight="700">AVS</tspan><tspan font-weight="300">PMC</tspan></text>
</svg>
